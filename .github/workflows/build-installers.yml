name: Windows CPU installer (internal test)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/macos-apple-silicon-mvp
    paths:
      - '.github/workflows/build-installers.yml'
      - 'app/**'
      - 'config/**'
      - 'packaging/**'
      - 'tools/build-windows-installer.ps1'
      - 'tools/download-cpu-model.py'
      - 'tools/verify-installer-layout.py'
      - 'requirements-windows-cpu.lock'
      - 'requirements-build.lock'
      - 'release-files.sha256.json'
      - 'tests/**'
# Model: csukuangfj2/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25
# Revision: 68818b2313fe77bd06f6a7c5068ff3ef59d02b8a
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-windows-cpu.lock
            requirements-build.lock
      - name: Self-test installer argument binding
        shell: pwsh
        run: ./tools/build-windows-installer.ps1 -SelfTest
      - name: Build and validate CPU Setup.exe
        shell: pwsh
        run: |
          ./tools/build-windows-installer.ps1
          python tools/verify-installer-layout.py dist/build/VIM2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VIM2-0.1.0-windows-x64-unsigned
          path: |
            dist/installers/VIM2-0.1.0-windows-x64-Setup.exe
            dist/installers/VIM2-0.1.0-windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
